services:
  plex:
    image: ghcr.io/linuxserver/plex:latest
    container_name: Plex
    hostname: plex
    network_mode: host
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:32400/identity"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - /volume1/docker/plex:/config:rw
      - /volume1/Media/Movies:/movies:ro
      - /volume1/Media/Music:/music:ro
      - /volume1/Media/Religious:/Religious:ro
      - /volume1/Media/Seasons:/Seasons:ro
      - /volume1/Media/Yoga:/Yoga:ro
    environment:
      TZ: America/Los_Angeles
      PUID: 1026
      PGID: 100
      VERSION: public
#      PLEX_CLAIM: claim-xXJERqyQ_xNs4j2kUyY6
    mem_limit: 2g       # bump to 4g if you regularly transcode 4K
    # cpus: not supported on this Synology kernel (no CFS bandwidth controller).
    # cpu_shares is a relative weight, not a hard cap, but works everywhere cgroups exist.
    # 1024 = default weight; lower it if you want other stacks favored during transcodes.
    cpu_shares: 1024
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    restart: on-failure:5
